name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches extension version
        run: node -e 'const p=require("./vscode/package.json"); if(process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/package-vscode.py
      - name: Publish VSIX release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vscode/output/motion-explainer.vsix --verify-tag --generate-notes --title "Motion Explainer $GITHUB_REF_NAME"
